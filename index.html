<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 1 Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EA; --card:#FFFFFF; --ink:#2B2340; --soft:#6B6380; --line:#EFE6D6;
  --sounds:#FF6B4A; --reading:#3D8BFF; --writing:#8E5CF7; --maths:#17A673; --world:#E8A400;
  --good:#17A673; --bad:#E5484D; --star:#FFB800;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Andika,"Comic Sans MS",system-ui,sans-serif;font-size:18px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 60px}
header.top{display:flex;align-items:center;gap:10px;padding:8px 0 14px}
.logo{font-family:Fredoka,sans-serif;font-weight:700;font-size:24px;flex:1;letter-spacing:.3px}
.logo span{color:var(--sounds)}
@media (max-width:480px){.logo{font-size:19px;white-space:nowrap}.gl{display:none}.pill{padding:7px 11px}}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px}
.pill.btn:active{transform:scale(.96)}
h1,h2,h3{font-family:Fredoka,sans-serif;margin:0 0 10px}
h1{font-size:28px} h2{font-size:23px} h3{font-size:19px}
.card{background:var(--card);border-radius:22px;padding:16px;border:2px solid var(--line);margin-bottom:14px}
.today{border-color:#FFD98A;background:linear-gradient(160deg,#FFF3CF,#FFFFFF 60%)}
.today .focus{color:var(--soft);font-size:15px;margin:-4px 0 12px}
.tasks{display:grid;gap:10px}
.task{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;font-size:18px;width:100%}
.task .ic{font-size:30px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.task .tx{flex:1}
.task small{display:block;color:var(--soft);font-size:14px}
.task .ck{font-size:26px}
.task.done{background:#EAFBF3;border-color:#A6E9C9}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone{border-radius:22px;padding:18px 14px;color:#fff;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.zone:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.zone .em{font-size:38px}
.zone b{font-family:Fredoka,sans-serif;font-size:22px}
.zone small{opacity:.92;font-size:14px}
.z-sounds{background:var(--sounds)} .z-reading{background:var(--reading)} .z-writing{background:var(--writing)} .z-maths{background:var(--maths)} .z-world{background:var(--world)}
.zone.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px}
.acts{display:grid;gap:10px}
.act{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:#fff;border:2px solid var(--line);text-align:left;font-size:19px;width:100%}
.act .em{font-size:34px}
.act small{display:block;color:var(--soft);font-size:14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:700}
.prog{flex:1;height:14px;background:#fff;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--star);transition:width .3s}
.stage{background:#fff;border-radius:26px;border:2px solid var(--line);padding:18px;text-align:center}
.prompt{font-family:Fredoka,sans-serif;font-size:26px;margin:4px 0 12px;line-height:1.3}
.prompt.big{font-size:40px}
.visual{margin:10px 0 16px;min-height:20px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.opt{background:#F7F3FF;border:3px solid #E3DAFB;border-radius:20px;padding:14px 6px;overflow:hidden;font-size:26px;font-weight:700;min-height:74px;display:flex;align-items:center;justify-content:center;gap:6px;flex-direction:column}
.opt.right{background:#DDF8EA;border-color:var(--good)}
.opt.wrong{background:#FFE4E4;border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.say-btn{background:#FFF1D6;border:2px solid #FFD98A;border-radius:999px;padding:8px 16px;font-size:17px;font-weight:700;margin:4px}
.big-btn{background:var(--sounds);color:#fff;border-radius:18px;padding:14px 22px;font-size:21px;font-weight:700;margin:6px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.big-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.big-btn.green{background:var(--good)} .big-btn.blue{background:var(--reading)} .big-btn.purple{background:var(--writing)} .big-btn.grey{background:#8C8799}
.small-btn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700;margin:4px}
.grapheme{font-size:96px;font-weight:700;line-height:1;margin:6px 0 4px;color:var(--sounds)}
.word-line{font-size:34px;margin:6px 0}
.word-line mark{background:#FFE2D9;color:var(--sounds);border-radius:6px;padding:0 2px}
.tip{background:#F4F7FF;border-radius:14px;padding:10px 12px;font-size:15px;color:#33406B;margin:12px auto 4px;max-width:520px;text-align:left}
.tip b{color:#1F3A93}
.soundbtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.sb{min-width:64px;padding:10px 8px 6px;border-radius:16px;background:#FFF6F3;border:3px solid #FFD3C7;font-size:38px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.sb .mk{margin-top:4px;height:8px;display:flex;justify-content:center}
.sb .dot{width:9px;height:9px;border-radius:50%;background:var(--sounds)}
.sb .dash{width:34px;height:6px;border-radius:4px;background:var(--sounds)}
.sb.lit{background:#FFE2D9;border-color:var(--sounds);transform:scale(1.07)}
.mic-area{margin-top:14px}
.heard{min-height:24px;color:var(--soft);font-size:16px;margin:6px}
.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.reveal{font-size:70px;margin:6px 0}
.sentence{font-size:28px;line-height:1.6;margin:8px 0 14px}
.sentence span{border-radius:8px;padding:0 3px;transition:background .2s}
.sentence span.hit{background:#C9F2DC}
.story{font-size:24px;line-height:1.7;text-align:left;background:#FBF8FF;border-radius:18px;padding:14px}
.story span{border-radius:6px;cursor:pointer}
.story span:active,.story span.lit{background:#FFE7A8}
.dots{display:inline-flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:330px}
.dot-c{width:26px;height:26px;border-radius:50%;background:var(--reading)}
.dot-c.b{background:var(--sounds)}
.dot-c.x{background:#CFCBD8;position:relative}
.dot-c.x:after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.tf{display:inline-grid;grid-template-columns:repeat(5,34px);gap:4px;padding:6px;border:3px solid #333;border-radius:8px;margin:4px;background:#fff}
.tf i{width:34px;height:34px;border:2px dashed #ccc;border-radius:6px;display:grid;place-items:center}
.tf i.on:after{content:"";width:24px;height:24px;border-radius:50%;background:var(--maths)}
.emoji-grid{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;max-width:420px;font-size:34px}
.emoji-grid .row5{display:flex;gap:4px}
.pv{display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.ten{display:grid;grid-template-rows:repeat(10,11px);gap:2px;padding:2px;background:#0F7A53;border-radius:4px}
.ten i{width:16px;background:#3ED39B;border-radius:2px}
.one{width:18px;height:18px;background:#FFB800;border-radius:3px;border:2px solid #C98F00}
.ones{display:grid;grid-template-columns:repeat(2,18px);gap:3px;margin-left:8px}
.group{display:inline-flex;flex-wrap:wrap;gap:2px;width:96px;justify-content:center;padding:8px;border:3px dashed #B7E8D3;border-radius:50%;margin:4px;font-size:22px;min-height:70px;align-items:center}
.slots{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.slot{min-width:62px;height:70px;border-bottom:4px solid var(--writing);font-size:38px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{background:#F3EEFF;border:3px solid #D9CCFF;border-radius:14px;padding:8px 14px;font-size:30px;font-weight:700;min-width:58px}
.tile.used{opacity:.25;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{background:#EEF5FF;border:3px solid #CBE0FF;border-radius:12px;padding:8px 12px;font-size:24px;font-weight:700}
.chip.used{opacity:.25;pointer-events:none}
.built{min-height:64px;border:3px dashed #CBE0FF;border-radius:16px;padding:10px;font-size:26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.trace-wrap{position:relative;width:min(92vw,380px);aspect-ratio:1;margin:0 auto;border-radius:22px;overflow:hidden;border:3px solid #E3DAFB;background:#fff}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.lines{position:absolute;inset:0;background:linear-gradient(#fff 0 0);pointer-events:none}
.fam{color:var(--writing);font-weight:700;font-size:16px;margin-bottom:6px}
.done-screen{text-align:center;padding:24px 10px}
.done-screen .bigstar{font-size:84px;animation:pop .6s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.stickers{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stk{aspect-ratio:1;border-radius:18px;background:#fff;border:2px dashed var(--line);display:grid;place-items:center;font-size:36px}
.stk.locked{filter:grayscale(1);opacity:.25}
.sets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.sets button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.sets button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* grown-ups */
.gu h2{margin-top:6px}
.gu p,.gu li{font-size:16px;line-height:1.5}
.wk{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff;font-size:15px}
.wk.now{border-color:var(--star);background:#FFF8E1}
.wk .d{font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.wk .row{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;line-height:1.35}
.wk .row b{color:var(--soft);font-weight:700}
.hol{background:#EAF3FF;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:15px;color:#33406B}
.psc{background:#FFE9E2;color:#9A2B12}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
a{color:#1F5FD1}
.modal{position:fixed;inset:0;background:rgba(30,20,50,.45);display:grid;place-items:center;z-index:60;padding:20px}
.modal .card{max-width:380px;text-align:center}
.muted{color:var(--soft);font-size:15px}
.coin text{font-family:Fredoka,sans-serif;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">Year 1 <span>Adventure</span></div>
    <button class="pill btn" id="starPill" aria-label="Sticker book">⭐ <span id="starCount">0</span></button>
    <button class="pill btn" id="grownBtn" aria-label="Grown-ups">👪<span class="gl"> Grown-ups</span></button>
  </header>
  <main id="app"></main>
</div>
<div id="fx"></div>

<script>
/* ============ helpers ============ */
const $app = document.getElementById('app');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const store={get(k,d){try{const v=localStorage.getItem('y1a-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('y1a-'+k,JSON.stringify(v))}catch(e){}}};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});

/* ============ voice: Claude TTS -> browser speech ============ */
let CTTS=null, DICT=null, listenCb=null;
let gbVoice=null, seqTok=0;
function voiceScore(v){let sc=0;const n=v.name,l=v.lang||'';if(/en[-_]GB/i.test(l))sc+=40;else if(/^en/i.test(l))sc+=10;else return -1;
 if(/natural|neural|premium|enhanced|siri/i.test(n))sc+=30;if(/google uk english female/i.test(n))sc+=25;if(/sonia|libby|maisie|serena|kate|stephanie|martha|hazel|susan|female/i.test(n))sc+=15;
 if(/compact|espeak|novelty|whisper|bad news|bells|boing|bubbles|cellos|jester|organ|trinoids|zarvox|albert|fred|junior|ralph|grandpa|grandma|rocko|shelley/i.test(n))sc-=60;return sc}
function loadVoices(){try{const vs=speechSynthesis.getVoices().filter(v=>voiceScore(v)>0).sort((a,b)=>voiceScore(b)-voiceScore(a));gbVoice=vs[0]||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
/* moods give the voice some expression: happy = brighter and livelier, gentle = softer and slower */
const MOODS={normal:{rate:.9,pitch:1.12,cr:.95},happy:{rate:1,pitch:1.3,cr:1.08},gentle:{rate:.84,pitch:1.05,cr:.88},slow:{rate:.72,pitch:1.1,cr:.8}};
function webSay(t,mood){return new Promise(res=>{try{const m=MOODS[mood]||MOODS.normal;const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(gbVoice)u.voice=gbVoice;u.rate=m.rate;u.pitch=m.pitch;let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,1200+t.length*110);speechSynthesis.speak(u)}catch(e){res()}})}
function sayOne(t,mood){const m=MOODS[mood]||MOODS.normal;if(CTTS)return CTTS.speak(t,{rate:m.cr,language:'en',voice:'airy'}).catch(e=>e&&e.code==='viewer_stopped'?null:webSay(t,mood));return webSay(t,mood)}
/* speak a list of parts with a real pause between them; a new call cancels the old one */
function speakSeq(parts,gap=900){const tok=++seqTok;try{speechSynthesis.cancel()}catch(e){}if(CTTS&&CTTS.stop)try{CTTS.stop()}catch(e){}let i=0;const next=()=>{if(tok!==seqTok||i>=parts.length)return;const p=parts[i++];const [t,mood]=Array.isArray(p)?p:[p,'normal'];sayOne(t,mood).then(()=>{if(tok===seqTok)setTimeout(next,gap)})};next()}
function speak(t,mood='normal'){if(t)speakSeq([[t,mood]])}
const cheer=()=>speak(pick(PRAISE),'happy');
const nearly=(t)=>speak(t||pick(TRY_AGAIN),'gentle');
if(window.claude&&claude.use){
  claude.use('tts').then(t=>{CTTS=t}).catch(()=>{});
  claude.use('dictation').then(d=>{ if(!d)return; DICT=d;
    d.onFinal(({text})=>{listenCb&&listenCb.final&&listenCb.final(text)});
    d.onPartial(({text})=>{listenCb&&listenCb.partial&&listenCb.partial(text)});
    d.onState(({state})=>{listenCb&&listenCb.state&&listenCb.state(state)});
  }).catch(()=>{});
}
const norm=s=>String(s).toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1)):j}return m[a.length][b.length]}
function wordMatch(heard,target){const t=norm(target),h=norm(heard);if(!h)return false;if(h.includes(t)||h.replace(/ /g,'')===t.replace(/ /g,''))return true;return h.split(' ').some(w=>t.length>3&&lev(w,t)<=1)}

/* mic block: real speech check where available, otherwise "I said it" */
function micBlock(target,onOk,{label='🎤 Say it!',sentence=null,onHeard=null}={}){
  const box=el(`<div class="mic-area"></div>`);
  if(DICT){
    const b=el(`<button class="big-btn">${label}</button>`);
    const heard=el(`<div class="heard"></div>`);
    const ok=el(`<button class="small-btn" style="display:none">👍 Grown-up: that was right</button>`);
    let all='',timer=null,done=false;
    const finish=()=>{ if(done)return; if(sentence){const r=onHeard(all);if(r){done=true;onOk()}else{heard.textContent=all?`I heard: “${all}” — try again!`:'I didn’t hear you — try again!';ok.style.display='inline-block'}}
      else if(wordMatch(all,target)){done=true;heard.textContent='I heard: “'+all+'” ✔';onOk()}
      else{heard.textContent=all?`I heard: “${all}” — have another go!`:'I didn’t hear you — try again!';ok.style.display='inline-block'} };
    b.onclick=()=>{all='';heard.textContent='Listening…';b.classList.add('listening');
      listenCb={final:t=>{all=(all+' '+t).trim();heard.textContent='I heard: “'+all+'”'; if(onHeard)onHeard(all,true); if(!sentence&&wordMatch(all,target)){DICT.stop().catch(()=>{})}},
        partial:t=>{heard.textContent='…'+t},
        state:s=>{if(s==='idle'){b.classList.remove('listening');clearTimeout(timer);finish()}}};
      DICT.start().catch(e=>{b.classList.remove('listening');heard.textContent='Microphone not available — tap the button below when you’ve said it.';ok.style.display='inline-block'});
      clearTimeout(timer);timer=setTimeout(()=>DICT.stop().catch(()=>{}),sentence?9000:4500);
    };
    ok.onclick=()=>{if(!done){done=true;onOk()}};
    box.append(b,heard,ok);
  }else{
    const b=el(`<button class="big-btn green">✅ I said it!</button>`);
    const n=el(`<div class="heard">Say it out loud to your grown-up, then tap.</div>`);
    b.onclick=()=>{b.disabled=true;onOk()};
    box.append(n,b);
  }
  return box;
}

/* ============ stars, stickers, fx ============ */
let stars=store.get('stars',0);
const STICKERS=['🦄','🐶','🦖','🚀','🌈','🐱','🦋','🍦','🐢','🦁','🐙','🚂','🌻','🐼','🦕','🍓','🐳','🧁','🏰','🐝','🦊','🐸','🎈','🦉','🐧','🍕','🎨','⚽','🦒','👑'];
function updateStars(){document.getElementById('starCount').textContent=stars}
function addStar(n=1){const before=Math.floor(stars/10);stars+=n;store.set('stars',stars);updateStars();if(Math.floor(stars/10)>before){toastSticker(STICKERS[Math.min(STICKERS.length-1,Math.floor(stars/10)-1)])}}
function toastSticker(s){const m=el(`<div class="modal"><div class="card"><div style="font-size:90px;animation:pop .6s">${s}</div><h2>New sticker!</h2><p class="muted">10 more stars collected. Brilliant!</p><button class="big-btn green">Yay!</button></div></div>`);m.querySelector('button').onclick=()=>m.remove();document.body.append(m);confetti();speak('Wow! You got a brand new sticker! Hooray!','happy')}
function confetti(){const fx=el('<div class="confetti"></div>');const cols=['#FF6B4A','#3D8BFF','#8E5CF7','#17A673','#FFB800'];for(let i=0;i<60;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=pick(cols);c.style.animationDelay=Math.random()*.6+'s';c.style.animationDuration=1.4+Math.random()+'s';fx.append(c)}document.body.append(fx);setTimeout(()=>fx.remove(),3000)}

 if(tab==='how'){c.innerHTML=`<div class="card"><h3>Little and often</h3><p>Ten to fifteen minutes a day works better than one long session. Sit with your child — the speaking games work best with a grown-up listening.</p><h3>The speaking games</h3><p>On Chrome on a computer (or the Claude desktop app) the 🎤 button listens and checks the word. On phones and iPads, listen to your child yourself and tap <b>“I said it!”</b>. Speech checking is never perfect with young voices, so you can always tap <b>“Grown-up: that was right”</b>.</p><h3>Stars & stickers</h3><p>A star for each first-try answer; every 10 stars unlocks a sticker. Progress is saved on this device only.</p><h3>What’s covered</h3><ul><li><b>Phonics & speaking:</b> Phase 3 & 5 sounds, other ways to spell sounds, blending, tricky words, alien words, speaking full sentences.</li><li><b>Reading:</b> reading sentences for meaning, short stories with questions.</li><li><b>Writing:</b> letter formation by family, capitals & numbers, spelling by sounds, sentence order and punctuation, -s/-es/-ing/-ed/-er/-est, un-.</li><li><b>Maths:</b> counting, place value to 100, add & subtract within 20, number bonds, counting in 2s/5s/10s, doubling, groups & sharing, halves & quarters, shape, position & direction, time, money, length, mass & capacity.</li><li><b>My World:</b> animal groups and diets, body & senses, materials, plants, seasons, days & months, the UK and hot & cold places.</li></ul><button class="small-btn" id="reset">Reset stars & progress</button></div>`;

 if(tab==='sounds'){c.innerHTML=`<div class="card"><h3>Say “pure” sounds</h3><p>Say <b>“mmm”</b> not “muh”, <b>“sss”</b> not “suh”, and keep short sounds like <b>t, p, k</b> clipped — no “uh” on the end. This makes blending much easier: “c-a-t” blends to “cat”, but “cuh-a-tuh” doesn’t.</p><h3>Sound buttons</h3><p>A <b>dot</b> under a letter means one letter makes the sound. A <b>dash</b> means two or three letters work together (sh, igh, air). A split sound like <b>a‿e</b> in “cake” is two letters apart that make one sound.</p><h3>Helping with speaking</h3><ul><li>Model it: say the word slowly, then ask your child to copy you.</li><li>Praise effort — never laugh at a mispronunciation.</li><li>Watch the mouth: lips round for “oo”, tongue out for “th”.</li><li>If a sound (like “th” or “r”) is still very hard by the summer, mention it to the class teacher.</li></ul></div>`}
 if(tab==='links'){c.innerHTML=`<div class="card"><h3>Free extras</h3><p class="muted">These open in a new tab.</p><ul>${Object.values(LINK).map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ul></div>`}}
